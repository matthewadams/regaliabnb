name: Render review cards

# When the daily task pushes a small queue JSON, render its PNG here in CI.
on:
  push:
    paths:
      - 'review-cards/queue/**.json'

permissions:
  contents: write

concurrency:
  group: render-review-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Shallow + sparse: never materialize the growing pile of existing card PNGs,
      # so CI stays fast no matter how many cards accumulate.
      - name: Checkout (shallow, sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            review-cards/queue
            review-cards/status
            .github
          sparse-checkout-cone-mode: false

      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            fonts-urw-base35 fonts-crosextra-caladea fonts-crosextra-carlito \
            fonts-lato fonts-liberation
          python3 -m pip install --quiet Pillow

      - name: Render queued cards
        run: |
          shopt -s nullglob
          files=(review-cards/queue/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No queued cards."; exit 0
          fi
          # Record stems up front so the failure step can mark them even after git rm.
          : > /tmp/stems.txt
          for f in "${files[@]}"; do basename "$f" .json >> /tmp/stems.txt; done
          for f in "${files[@]}"; do
            echo "Rendering from $f"
            python3 tools/render_from_queue.py "$f"
            git rm --quiet "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --sparse lets us add PNGs at paths outside the sparse-checkout set
          git add --sparse review-cards/*.png
          git commit -m "Render review cards [skip ci]"
          # Rebase-before-push with retry: survive a concurrent push landing on main
          # while this run was in flight (the non-fast-forward that used to fail us).
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $attempt"; exit 0; fi
            echo "Push rejected (attempt $attempt) — rebasing on latest main"
            git pull --rebase origin main
          done
          echo "Push failed after 5 rebase attempts"; exit 1

      # Fast, git-observable failure signal so the queuing task can react in ~30s
      # instead of waiting out a blind poll timeout. Writes one marker per queued
      # stem under review-cards/status/ (NOT queue/, so it doesn't re-trigger CI).
      - name: Report render failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p review-cards/status
          ts="$(date -u +%FT%TZ)"
          while read -r stem; do
            [ -n "$stem" ] || continue
            printf '{"stem":"%s","failed_at":"%s","run":"%s","sha":"%s"}\n' \
              "$stem" "$ts" "${GITHUB_RUN_ID}" "${GITHUB_SHA}" \
              > "review-cards/status/${stem}.failed.json"
          done < /tmp/stems.txt
          git add --sparse review-cards/status/*.failed.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Render failure marker [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              git pull --rebase origin main
            done
          fi